name: locus
description: Locus is a project to mark attendance, leaves  & OD.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 3.4.9+30

environment:
  sdk: ">=2.17.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^0.13.4
  provider: ^6.0.3
  bloc: ^8.0.3
  flutter_bloc: ^8.0.1
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  hive: ^2.2.3
  path_provider: ^2.0.11
  json_annotation: ^4.8.1
  hive_generator: ^2.0.1
  intl: ^0.17.0
  dropdown_button2: ^1.7.1
  carousel_slider: ^5.0.0
  curved_navigation_bar: ^1.0.3
  #geocoding: ^2.0.4
  geocoding: ^2.1.0
  geolocator: ^9.0.1
  google_maps_flutter: ^2.1.10
  syncfusion_flutter_datepicker: ^20.2.45
  image_picker: ^0.8.5+3
  shared_preferences: ^2.0.15
  firebase_crashlytics: ^3.5.7
  flutter_local_notifications: ^17.2.3
  firebase_messaging: ^14.7.10
  firebase_core: ^2.24.2
  time_range: ^1.0.3
  camera: ^0.11.0+1
  permission_handler: ^12.0.0+1
  lottie: ^2.2.0
  file_picker: ^10.1.9
  in_app_update: ^4.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  json_serializable: 6.7.1
  build_runner: 2.4.9

dependency_overrides:
  camera:
    git:
      url: https://github.com/bottlepay/plugins.git
      path: packages/camera/camera
      ref: e1a4dba770da9bc3cf9f858bac6837083f8b9059
  #logging: 1.2.0

flutter:

  uses-material-design: true

  assets:
     - assets/images/
     - assets/lottie/
  #   - images/a_dot_ham.jpeg

  fonts:
     - family: Poppins
       fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Bold.ttf

