name: locus
description: Locus is a project to mark attendace, leaves  & OD.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^0.13.4
  provider: ^6.0.3
  bloc: ^8.0.3
  flutter_bloc: ^8.0.1
  freezed: ^2.1.0+1
  freezed_annotation: ^2.1.0
  hive: ^2.2.3
  path_provider: ^2.0.11
  json_annotation: ^4.6.0
  hive_generator: ^1.1.3
  intl: ^0.17.0
  dropdown_button2: ^1.7.1
  carousel_slider: ^4.1.1
  curved_navigation_bar: ^1.0.3
  geocoding: ^2.0.4
  geolocator: ^9.0.1
  google_maps_flutter: ^2.1.10
  syncfusion_flutter_datepicker: ^20.2.45
  image_picker: ^0.8.5+3
#  firebase_messaging: ^13.0.2
#  firebase_core: ^1.22.0
#  flutter_local_notifications: ^11.0.0
#  firebase_crashlytics: ^2.8.10


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  json_serializable: ^6.3.1
  build_runner: ^2.2.0


flutter:

  uses-material-design: true

  assets:
     - assets/images/
  #   - images/a_dot_ham.jpeg

  fonts:
     - family: Poppins
       fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Bold.ttf

